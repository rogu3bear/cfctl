<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Return to cfctl</title><link rel="stylesheet" href="/style.css"></head>
<body><main><p class="eyebrow">OAuth callback</p><h1>Copy this one-time response to cfctl.</h1><p>This page does not transmit the authorization code. It reads the URL in your browser and displays a short-lived copy value.</p><pre><code id="payload">Checking callback…</code></pre><button id="copy" type="button">Copy response</button><p id="status" role="status"></p></main>
<script>
  const params = new URLSearchParams(location.search);
  const state = params.get('state');
  const code = params.get('code');
  const error = params.get('error');
  const payload = state && code ? `${state} ${code}` : `OAuth error: ${error || 'missing state or code'}`;
  document.querySelector('#payload').textContent = payload;
  history.replaceState({}, '', location.pathname);
  document.querySelector('#copy').addEventListener('click', async () => {
    if (!state || !code) return;
    await navigator.clipboard.writeText(payload);
    document.querySelector('#status').textContent = 'Copied. Paste it into the waiting cfctl command.';
  });
</script></body></html>
