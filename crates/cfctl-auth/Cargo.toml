[package]
name = "cfctl-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
directories.workspace = true
keyring-core = "1.0.0"
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true

# keyring 4.x splits the facade from the backends. Upstream directs apps that
# choose their own per-platform store to link keyring-core plus the specific
# store crates, rather than the `v1` bundle (which hardcodes async zbus on
# Linux). We keep the sync Secret Service backend deliberately.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust", "vendored"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
