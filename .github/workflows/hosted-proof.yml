name: Hosted proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosted-proof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  rust-proof:
    name: Rust proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PROOF_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$PROOF_SHA"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint every Rust target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test every Rust target
        run: cargo test --workspace --all-targets --locked

      - name: Recheck the Cloudflare request contract
        run: cargo test -p cfctl-cloudflare --test request --locked

  site-proof:
    name: Website proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PROOF_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$PROOF_SHA"

      - name: Install the pinned Bun runtime
        run: npm install --global bun@1.3.14

      - name: Install the pinned WebAssembly target and site build tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install cargo-leptos --version 0.3.5 --locked
          cargo install worker-build --version 0.7.5 --locked

      - name: Check website formatting
        working-directory: site
        run: cargo fmt -- --check

      - name: Lint every website target
        working-directory: site
        run: cargo clippy --all-targets --features ssr --locked -- -D warnings

      - name: Test every website target
        working-directory: site
        run: cargo test --all-targets --features ssr --locked

      - name: Reproduce the complete edge artifact
        working-directory: site
        run: ./scripts/verify-reproducible-edge.sh
