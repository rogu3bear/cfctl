[workspace]
resolver = "2"
members = [
  "crates/cfctl-agent",
  "crates/cfctl-auth",
  "crates/cfctl-catalog",
  "crates/cfctl-cloudflare",
  "crates/cfctl-core",
  "crates/cfctl-planner",
  "crates/cfctl-registry",
  "crates/cfctl-storage",
  "crates/cfctl-workspace",
  "crates/cfctl-cli",
  "xtask",
]

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/rogu3bear/cfctl"

[workspace.dependencies]
# Intra-workspace crates: path + version declared once here, consumed by member
# crates as `cfctl-x = { workspace = true }`.
cfctl-agent = { path = "crates/cfctl-agent", version = "1.2.1" }
cfctl-auth = { path = "crates/cfctl-auth", version = "1.2.1" }
cfctl-catalog = { path = "crates/cfctl-catalog", version = "1.2.1" }
cfctl-cli = { path = "crates/cfctl-cli", version = "1.2.1" }
cfctl-cloudflare = { path = "crates/cfctl-cloudflare", version = "1.2.1" }
cfctl-core = { path = "crates/cfctl-core", version = "1.2.1" }
cfctl-planner = { path = "crates/cfctl-planner", version = "1.2.1" }
cfctl-registry = { path = "crates/cfctl-registry", version = "1.2.1" }
cfctl-storage = { path = "crates/cfctl-storage", version = "1.2.1" }
cfctl-workspace = { path = "crates/cfctl-workspace", version = "1.2.1" }
async-trait = "0.1.91"
base64 = "0.22.1"
clap = { version = "4.6.3", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
futures-util = "0.3.33"
hex = "0.4.3"
http = "1.4.2"
libc = "=0.2.186"
memchr = "2.7.6"
md-5 = "0.11.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.5"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"

[profile.dev]
debug = "line-tables-only"
