[workspace]
resolver = "2"
members = [
  "crates/cfctl-agent",
  "crates/cfctl-auth",
  "crates/cfctl-catalog",
  "crates/cfctl-cloudflare",
  "crates/cfctl-core",
  "crates/cfctl-planner",
  "crates/cfctl-storage",
  "crates/cfctl-workspace",
  "crates/cfctl-cli",
  "xtask",
]

[workspace.package]
version = "1.1.2"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/rogu3bear/cfctl"

[workspace.dependencies]
# Intra-workspace crates: path + version declared once here, consumed by member
# crates as `cfctl-x = { workspace = true }`.
cfctl-agent = { path = "crates/cfctl-agent", version = "1.1.2" }
cfctl-auth = { path = "crates/cfctl-auth", version = "1.1.2" }
cfctl-catalog = { path = "crates/cfctl-catalog", version = "1.1.2" }
cfctl-cloudflare = { path = "crates/cfctl-cloudflare", version = "1.1.2" }
cfctl-core = { path = "crates/cfctl-core", version = "1.1.2" }
cfctl-planner = { path = "crates/cfctl-planner", version = "1.1.2" }
cfctl-storage = { path = "crates/cfctl-storage", version = "1.1.2" }
cfctl-workspace = { path = "crates/cfctl-workspace", version = "1.1.2" }
async-trait = "0.1.88"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
oauth2 = { version = "5.0.0", default-features = false }
rand = "0.9.1"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"
tempfile = "3.19.1"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
toml = "0.9.2"
tracing = "0.1.41"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.0"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
